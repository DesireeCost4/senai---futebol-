# https://hub.docker.com/_/mysql#connect-to-mysql-from-the-mysql-command-line-client
# https://github.com/docker/awesome-compose
services:
  mysql:
    image: 'mysql:8.4'
    container_name: db
    env_file:
      - .env
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - vol_books:/var/lib/mysql
    environment:
      - 'MYSQL_DATABASE=${DB_NAME}'
      - 'MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}'
      - 'MYSQL_USER=${DB_USER}'
      - 'MYSQL_PASSWORD=${DB_PASSWORD}'
    ports:
      - '${DB_PORT}:3306'

volumes:
  vol_books:
    name: "vol_senaiFut"
